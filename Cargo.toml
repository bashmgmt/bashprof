[package]
name = "bashprof"
version = "0.1.0"
edition = "2024"
description = "Time a tree of calls in a bash program: spans travel on the wire as messages, nothing is timed or inferred in bash."
license = "MIT"
readme = "README.md"
repository = "https://github.com/bashmgmt/bashprof"
keywords = ["bash", "shell", "profiling", "timing", "tracing"]
categories = ["development-tools::profiling", "command-line-utilities"]

[dependencies]
bash-interop = "0.1"
bash-strings = "0.1"
hylic = "0.8"
either = "1.15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.53", features = ["rt", "macros"] }
